name: Java CI with Gradle and CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: write
  security-events: write

jobs:
  analyze:
    name: Build and Analyze
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        dependency-graph: generate-and-submit

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4  # Fixes the v3 deprecation warning
      with:
        languages: java-kotlin
        build-mode: manual
        queries: security-and-quality

    - name: Build and Compile with Gradle Wrapper
      run: ./gradlew build --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4  # Fixes the v3 deprecation warning
      with:
        category: "/language:java-kotlin"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Fabric-Mod-Artifacts
        path: build/libs/
        if-no-files-found: error
